# Builds RipplesPotion.exe (the installer window with Python bundled, so
# Windows users need nothing else). Runs on every published release, attaching
# the exe to it, and on demand from the Actions tab.
name: Windows exe

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build
        run: |
          pip install pyinstaller==6.11.1
          pyinstaller --onefile --windowed --name RipplesPotion --paths patcher patcher/gui.py
      - uses: actions/upload-artifact@v4
        with:
          name: RipplesPotion
          path: dist/RipplesPotion.exe
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/RipplesPotion.exe --clobber
